name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The framework moves faster than the book does. A weekly run tells us when
    # a new release has broken an example before a reader finds it.
    - cron: '0 6 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Lint every example
        run: find chapters tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: vendor/bin/phpunit --no-coverage
